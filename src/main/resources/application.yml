server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: cab-booking-system

  # Datasource Configuration (PostgreSQL)
  datasource:
    url: jdbc:postgresql://localhost:5432/cab_booking_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000

  # JPA & Hibernate Settings
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
    open-in-view: false

  # Mail Configuration
  mail:
    host: ${MAIL_HOST:smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your_mail_username}
    password: ${MAIL_PASSWORD:your_mail_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Application Custom Configurations
app:
  # JWT Configuration
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: 86400000 # 24 hours in milliseconds
    expiration-ms: 86400000 # 24 hours in milliseconds

  # Stripe Payment Gateway Configuration
  stripe:
    api-key: ${STRIPE_API_KEY:sk_test_51MockStripeSecretApiKeyPlaceholder1234567890abcdef}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_mockWebhookSecretKeyPlaceholder}

  # Google Maps Service Configuration
  google:
    maps:
      api-key: ${GOOGLE_MAPS_API_KEY:AIzaSyMockGoogleMapsApiKeyPlaceholder12345}

  # WebSocket Real-Time Tracking Configuration
  websocket:
    endpoint: /ws
    topic-prefix: /topic
    app-destination-prefix: /app
    allowed-origins: "*"

# Springdoc OpenAPI / Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  show-actuator: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.labmentix.cabbooking: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
